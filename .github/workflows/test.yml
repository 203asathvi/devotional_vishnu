name: Devotional Pages — Test Suite

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: testing
        run: npm install

      - name: Install Playwright browsers
        working-directory: testing
        run: npx playwright install chromium --with-deps

      - name: Wait for Cloudflare deployment
        run: |
          TARGET_URL="https://dev.devotional-vishnu.pages.dev"
          echo "TARGET_URL=$TARGET_URL" >> $GITHUB_ENV
          echo "Waiting for $TARGET_URL..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/index.html" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deployment is live"
              break
            fi
            sleep 15
          done

      - name: Run Playwright tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test
        continue-on-error: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: testing/test-report/
          retention-days: 14

      - name: Post summary
        if: always()
        working-directory: testing
        run: node summarise.js >> $GITHUB_STEP_SUMMARY
