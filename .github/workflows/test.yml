name: Devotional Pages — Test Suite

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to test (leave blank for dev)'
        required: false
        default: 'https://dev.devotional-vishnu.pages.dev'

env:
  TARGET_URL: ${{ github.event.inputs.target_url || 'https://dev.devotional-vishnu.pages.dev' }}

jobs:

  # ── 0. Preflight ─────────────────────────────────────────────────────────────
  preflight:
    name: 🔍 Preflight — Site reachable
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Notify Slack — tests starting
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then exit 0; fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚀 Devotional Tests starting | URL: ${{ env.TARGET_URL }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

      - name: Check site is up
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 5 "${{ env.TARGET_URL }}/index.html" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "✅ Site is live"; exit 0; fi
            sleep 10
          done
          echo "❌ Site not reachable"; exit 1

  # ── 1. Index ─────────────────────────────────────────────────────────────────
  test-index:
    name: 🏠 Index Page
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run index tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Index Page" --workers=2
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-index
          path: testing/test-report/
          retention-days: 7

  # ── 2. Audio ─────────────────────────────────────────────────────────────────
  test-audio:
    name: 🔊 Audio
    needs: test-index
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run audio tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Audio" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-audio
          path: testing/test-report/
          retention-days: 7

  # ── 3. Scroll ────────────────────────────────────────────────────────────────
  test-scroll:
    name: ↕ Scroll Pill
    needs: test-audio
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run scroll tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Scroll Pill" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-scroll
          path: testing/test-report/
          retention-days: 7

  # ── 4. Font ──────────────────────────────────────────────────────────────────
  test-font:
    name: 🔤 Font Size
    needs: test-scroll
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run font tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Font Size" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-font
          path: testing/test-report/
          retention-days: 7

  # ── 5. Comments ──────────────────────────────────────────────────────────────
  test-comments:
    name: 💬 Comments
    needs: test-font
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run comment tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Comments" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-comments
          path: testing/test-report/
          retention-days: 7

  # ── 6. Donate ────────────────────────────────────────────────────────────────
  test-donate:
    name: 💛 Donate
    needs: test-comments
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run donate tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Donate" --workers=2
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-donate
          path: testing/test-report/
          retention-days: 7

  # ── 7. Nav ───────────────────────────────────────────────────────────────────
  test-nav:
    name: 🔍 Nav & Search
    needs: test-donate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run nav tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Nav" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-nav
          path: testing/test-report/
          retention-days: 7

  # ── 8. Mobile ────────────────────────────────────────────────────────────────
  test-mobile:
    name: 📱 Mobile 360px
    needs: test-nav
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run mobile tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Mobile" --workers=2
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-mobile
          path: testing/test-report/
          retention-days: 7

  # ── 9. Summary + Slack ───────────────────────────────────────────────────────
  summary:
    name: 📋 Summary & Notify
    needs: [test-index, test-audio, test-scroll, test-font, test-comments, test-donate, test-nav, test-mobile]
    runs-on: ubuntu-latest
    if: always()   # runs even if jobs were cancelled
    timeout-minutes: 2
    steps:
      - name: Build summary table
        run: |
          echo "## 📋 Devotional Pages — Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**URL tested:** ${{ env.TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏠 Index Page   | ${{ needs.test-index.result }}    |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔊 Audio        | ${{ needs.test-audio.result }}    |" >> $GITHUB_STEP_SUMMARY
          echo "| ↕ Scroll Pill  | ${{ needs.test-scroll.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔤 Font Size    | ${{ needs.test-font.result }}     |" >> $GITHUB_STEP_SUMMARY
          echo "| 💬 Comments     | ${{ needs.test-comments.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💛 Donate       | ${{ needs.test-donate.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Nav & Search | ${{ needs.test-nav.result }}      |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Mobile 360px | ${{ needs.test-mobile.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📥 Download individual reports from Artifacts below" >> $GITHUB_STEP_SUMMARY

      - name: Slack — final notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "No Slack webhook — skipping"
            exit 0
          fi

          # Collect each job result
          R_INDEX="${{ needs.test-index.result }}"
          R_AUDIO="${{ needs.test-audio.result }}"
          R_SCROLL="${{ needs.test-scroll.result }}"
          R_FONT="${{ needs.test-font.result }}"
          R_COMMENTS="${{ needs.test-comments.result }}"
          R_DONATE="${{ needs.test-donate.result }}"
          R_NAV="${{ needs.test-nav.result }}"
          R_MOBILE="${{ needs.test-mobile.result }}"

          # Map result to emoji
          emoji() { [ "$1" = "success" ] && echo "✅" || ([ "$1" = "cancelled" ] && echo "⏹" || echo "❌"); }

          # Overall status
          ALL="$R_INDEX $R_AUDIO $R_SCROLL $R_FONT $R_COMMENTS $R_DONATE $R_NAV $R_MOBILE"
          if echo "$ALL" | grep -q "cancelled"; then
            HEADER="⏹ Tests cancelled"
          elif echo "$ALL" | grep -q "failure"; then
            HEADER="❌ Tests completed with failures"
          else
            HEADER="✅ All tests passed"
          fi

          MSG=$(cat << SLACKMSG
          {
            "text": "$HEADER",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "$HEADER" }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*URL:* ${{ env.TARGET_URL }}\n$(emoji $R_INDEX) Index  |  $(emoji $R_AUDIO) Audio  |  $(emoji $R_SCROLL) Scroll  |  $(emoji $R_FONT) Font\n$(emoji $R_COMMENTS) Comments  |  $(emoji $R_DONATE) Donate  |  $(emoji $R_NAV) Nav  |  $(emoji $R_MOBILE) Mobile"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Run" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          SLACKMSG
          )

          curl -s -X POST -H 'Content-type: application/json' \
            --data "$MSG" "$SLACK_WEBHOOK"
