name: Devotional Pages — Test Suite

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to test (leave blank for dev)'
        required: false
        default: 'https://dev.devotional-vishnu.pages.dev'

env:
  TARGET_URL: ${{ github.event.inputs.target_url || 'https://dev.devotional-vishnu.pages.dev' }}
  REPORT_URL: https://203asathvi.github.io/devotional_vishnu
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  preflight:
    name: 🔍 Preflight — Site reachable
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Debug — check Slack secret exists
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "⚠️ SLACK_WEBHOOK_URL secret is NOT set"
          else
            echo "✅ SLACK_WEBHOOK_URL secret exists"
          fi

      - name: Notify Slack — tests starting
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚀 *Devotional Tests starting*\nURL: ${{ env.TARGET_URL }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

      - name: Check site is up
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 5 \
              "${{ env.TARGET_URL }}/index.html" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "✅ Site is live"; exit 0; fi
            sleep 10
          done
          echo "❌ Site not reachable"; exit 1

      - name: Notify Slack — preflight failed
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ *Preflight FAILED* — site not reachable\nURL: ${{ env.TARGET_URL }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

  test-index:
    name: 🏠 Index Page
    needs: preflight
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run index tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Index Page" --workers=2
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-index
          path: testing/blob-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          ICON=$([ "${{ job.status }}" = "cancelled" ] && echo "⏹" || echo "❌")
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$ICON *Index Page* tests ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

  test-audio:
    name: 🔊 Audio
    needs: test-index
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run audio tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Audio" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-audio
          path: testing/blob-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          ICON=$([ "${{ job.status }}" = "cancelled" ] && echo "⏹" || echo "❌")
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$ICON *Audio* tests ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

  test-scroll:
    name: ↕ Scroll Pill
    needs: test-audio
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run scroll tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Scroll Pill" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-scroll
          path: testing/blob-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          ICON=$([ "${{ job.status }}" = "cancelled" ] && echo "⏹" || echo "❌")
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$ICON *Scroll Pill* tests ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

  test-font:
    name: 🔤 Font Size
    needs: test-scroll
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run font tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Font Size" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-font
          path: testing/blob-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          ICON=$([ "${{ job.status }}" = "cancelled" ] && echo "⏹" || echo "❌")
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$ICON *Font Size* tests ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

  test-comments:
    name: 💬 Comments
    needs: test-font
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run comment tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Comments" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-comments
          path: testing/blob-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          ICON=$([ "${{ job.status }}" = "cancelled" ] && echo "⏹" || echo "❌")
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$ICON *Comments* tests ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

  test-donate:
    name: 💛 Donate
    needs: test-comments
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run donate tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Donate" --workers=2
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-donate
          path: testing/blob-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          ICON=$([ "${{ job.status }}" = "cancelled" ] && echo "⏹" || echo "❌")
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$ICON *Donate* tests ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

  test-nav:
    name: 🔍 Nav & Search
    needs: test-donate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run nav tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Nav" --workers=3
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-nav
          path: testing/blob-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          ICON=$([ "${{ job.status }}" = "cancelled" ] && echo "⏹" || echo "❌")
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$ICON *Nav & Search* tests ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

  test-mobile:
    name: 📱 Mobile 360px
    needs: test-nav
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
        working-directory: testing
      - run: npx playwright install chromium --with-deps
        working-directory: testing
      - name: Run mobile tests
        working-directory: testing
        env:
          BASE_URL: ${{ env.TARGET_URL }}
        run: npx playwright test --grep "Mobile" --workers=2
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-mobile
          path: testing/blob-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          ICON=$([ "${{ job.status }}" = "cancelled" ] && echo "⏹" || echo "❌")
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$ICON *Mobile* tests ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK"

  publish-report:
    name: 📊 Publish HTML Report
    needs: [test-index, test-audio, test-scroll, test-font, test-comments, test-donate, test-nav, test-mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev

      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - run: npm install
        working-directory: testing

      - name: Download all blob reports
        uses: actions/download-artifact@v7
        with:
          path: all-blobs/
          pattern: blob-*
          merge-multiple: false
        continue-on-error: true

      - name: Merge blobs into single HTML report
        run: |
          echo "=== Downloaded artifacts ==="
          find all-blobs/ -type f | head -30 || echo "No artifacts found"

          mkdir -p all-blobs-flat

          # Copy all blob files - playwright blob reporter produces .zip files
          find all-blobs/ -name "*.zip" | while read f; do
            echo "Copying blob: $f"
            cp "$f" all-blobs-flat/
          done

          # Also try copying any report.jsonl files directly
          find all-blobs/ -name "*.jsonl" | while read f; do
            echo "Copying jsonl: $f"
            cp "$f" all-blobs-flat/
          done

          echo "=== Blob flat contents ==="
          ls -la all-blobs-flat/ || echo "Empty"

          # Run merge
          echo "=== Running merge-reports ==="
          cd testing
          npx playwright merge-reports --reporter html ../all-blobs-flat
          MERGE_EXIT=$?
          echo "merge-reports exit code: $MERGE_EXIT"

          echo "=== test-report contents ==="
          ls -la test-report/ || echo "test-report directory not created"
          cd ..

          # Copy to public
          mkdir -p public
          if [ -f "testing/test-report/index.html" ]; then
            echo "✅ Playwright HTML report generated successfully"
            cp -r testing/test-report/. public/
          else
            echo "❌ Playwright report not generated — using fallback summary"
            cat > public/index.html << HTMLEOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Devotional Tests — Run #${{ github.run_number }}</title>
            <style>
              body{font-family:sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f8f8f8}
              .card{background:white;border-radius:8px;padding:16px 20px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;justify-content:space-between}
              .pass{background:#e8f5e9;color:#2e7d32;padding:3px 10px;border-radius:12px;font-size:12px}
              .fail{background:#ffebee;color:#c62828;padding:3px 10px;border-radius:12px;font-size:12px}
              .meta{color:#888;font-size:13px;margin-bottom:20px}
              a{color:#0066cc}
            </style>
          </head>
          <body>
            <h1>📊 Devotional Tests — Run #${{ github.run_number }}</h1>
            <p class="meta">${{ env.TARGET_URL }} · <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View full run →</a></p>
            <div class="card"><span>🏠 Index Page</span><span class="${{ needs.test-index.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-index.result }}</span></div>
            <div class="card"><span>🔊 Audio</span><span class="${{ needs.test-audio.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-audio.result }}</span></div>
            <div class="card"><span>↕ Scroll Pill</span><span class="${{ needs.test-scroll.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-scroll.result }}</span></div>
            <div class="card"><span>🔤 Font Size</span><span class="${{ needs.test-font.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-font.result }}</span></div>
            <div class="card"><span>💬 Comments</span><span class="${{ needs.test-comments.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-comments.result }}</span></div>
            <div class="card"><span>💛 Donate</span><span class="${{ needs.test-donate.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-donate.result }}</span></div>
            <div class="card"><span>🔍 Nav & Search</span><span class="${{ needs.test-nav.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-nav.result }}</span></div>
            <div class="card"><span>📱 Mobile 360px</span><span class="${{ needs.test-mobile.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-mobile.result }}</span></div>
            <p class="meta">⚠️ Detailed report unavailable — check Actions artifacts for blob-* files</p>
          </body>
          </html>
          HTMLEOF
          fi
      - name: Create summary index page
        run: |
          cat > public/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Devotional Pages — Test Report #${{ github.run_number }}</title>
            <style>
              body{font-family:sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f8f8f8;color:#333}
              h1{margin-bottom:4px}
              .meta{color:#888;font-size:13px;margin-bottom:24px}
              .meta a{color:#0066cc}
              .card{background:white;border-radius:8px;padding:16px 20px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,0.1);display:flex;justify-content:space-between;align-items:center}
              .label{font-weight:500}
              .pass{background:#e8f5e9;color:#2e7d32}
              .fail{background:#ffebee;color:#c62828}
              .badge{font-size:12px;padding:3px 10px;border-radius:12px}
            </style>
          </head>
          <body>
            <h1>📊 Devotional Tests</h1>
            <div class="meta">
              Run #${{ github.run_number }} &bull; ${{ env.TARGET_URL }} &bull;
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Actions run →</a>
            </div>
            <div class="card"><span class="label">🏠 Index Page</span><span class="badge ${{ needs.test-index.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-index.result }}</span></div>
            <div class="card"><span class="label">🔊 Audio</span><span class="badge ${{ needs.test-audio.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-audio.result }}</span></div>
            <div class="card"><span class="label">↕ Scroll Pill</span><span class="badge ${{ needs.test-scroll.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-scroll.result }}</span></div>
            <div class="card"><span class="label">🔤 Font Size</span><span class="badge ${{ needs.test-font.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-font.result }}</span></div>
            <div class="card"><span class="label">💬 Comments</span><span class="badge ${{ needs.test-comments.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-comments.result }}</span></div>
            <div class="card"><span class="label">💛 Donate</span><span class="badge ${{ needs.test-donate.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-donate.result }}</span></div>
            <div class="card"><span class="label">🔍 Nav & Search</span><span class="badge ${{ needs.test-nav.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-nav.result }}</span></div>
            <div class="card"><span class="label">📱 Mobile 360px</span><span class="badge ${{ needs.test-mobile.result == 'success' && 'pass' || 'fail' }}">${{ needs.test-mobile.result }}</span></div>
          </body>
          </html>
          EOF

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  summary:
    name: 📋 Summary & Notify
    needs: [test-index, test-audio, test-scroll, test-font, test-comments, test-donate, test-nav, test-mobile, publish-report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Build summary table
        run: |
          echo "## 📋 Devotional Pages — Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**URL tested:** ${{ env.TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Report:** ${{ env.REPORT_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏠 Index   | ${{ needs.test-index.result }}    |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔊 Audio   | ${{ needs.test-audio.result }}    |" >> $GITHUB_STEP_SUMMARY
          echo "| ↕ Scroll  | ${{ needs.test-scroll.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔤 Font    | ${{ needs.test-font.result }}     |" >> $GITHUB_STEP_SUMMARY
          echo "| 💬 Comments| ${{ needs.test-comments.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💛 Donate  | ${{ needs.test-donate.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Nav     | ${{ needs.test-nav.result }}      |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Mobile  | ${{ needs.test-mobile.result }}   |" >> $GITHUB_STEP_SUMMARY

      - name: Slack — final summary
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && echo "⚠️ SLACK_WEBHOOK_URL not set" && exit 0
          R_INDEX="${{ needs.test-index.result }}"
          R_AUDIO="${{ needs.test-audio.result }}"
          R_SCROLL="${{ needs.test-scroll.result }}"
          R_FONT="${{ needs.test-font.result }}"
          R_COMMENTS="${{ needs.test-comments.result }}"
          R_DONATE="${{ needs.test-donate.result }}"
          R_NAV="${{ needs.test-nav.result }}"
          R_MOBILE="${{ needs.test-mobile.result }}"
          e() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹";; *) echo "⏭";; esac; }
          ALL="$R_INDEX $R_AUDIO $R_SCROLL $R_FONT $R_COMMENTS $R_DONATE $R_NAV $R_MOBILE"
          if   echo "$ALL" | grep -q "cancelled"; then HDR="⏹ Tests cancelled"
          elif echo "$ALL" | grep -q "failure";   then HDR="❌ Tests failed"
          else                                         HDR="✅ All tests passed"
          fi
          MSG="$HDR\n$(e $R_INDEX) Index  $(e $R_AUDIO) Audio  $(e $R_SCROLL) Scroll  $(e $R_FONT) Font\n$(e $R_COMMENTS) Comments  $(e $R_DONATE) Donate  $(e $R_NAV) Nav  $(e $R_MOBILE) Mobile\nURL: ${{ env.TARGET_URL }}\n<${{ env.REPORT_URL }}|📊 View HTML Report>  <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
          HTTP=$(curl -s -o /tmp/slack_out.txt -w "%{http_code}" \
            -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MSG\"}" "$SLACK_WEBHOOK")
          echo "Slack HTTP: $HTTP — $(cat /tmp/slack_out.txt)"
